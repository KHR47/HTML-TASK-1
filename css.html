<!DOCTYPE html>
<html lang="en">
<head>
    <title> Task 2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <img src="1.jpg" alt="Application Logo" class="imgLogo">
    <h3>Welcome to AQC</h3>
    <div class="container">
        <div class="left">
            <h4>Air Quality Checker</h4>
            <form id="myForm" onsubmit="return validateForm()">

                <label>Username : </label>
                <input type="text" id="uName" placeholder="rahman222" minlength="6">
                <span id="userMsg" class="error"></span>
                 
                <br><br>
                <label>Email : </label>
                <input type="email" id="uEmail" placeholder="abc1233@gmail.com" minlength="8">
                <span id="emailMsg" class="error"></span>
                <br><br>

                <label>Password : </label>
                <input type="password" id="uPass" placeholder="*****" minlength="8">
                <span id="passMsg" class="error"></span>
                <br><br>

                <label>Date of Birth : </label>
                <input type="date" id="uDOB" placeholder="DD/MM/YYYY">
                <span id="dobMsg" class="error"></span>
                <br><br>

                <label>Country : </label>
                <select id="uCountry">
                    <option value="">Select Country</option>
                    <option value="USA">USA</option>
                    <option value="UK">UK</option>
                    <option value="Canada">Canada</option>
                    <option value="Australia">Australia</option>
                </select>
                <span id="countryMsg" class="error"></span>

                <br><br>
                <label>Gender : </label>
                <label for="male">Male</label>
                <input type="radio" id="uMale" name="gender" value="Male">
                <label for="female">Female</label>
                <input type="radio" id="uFemale" name="gender" value="Female">
                <span id="genderMsg" class="error"></span>
                <br><br>

                <label>Background color:</label>
                <input type="color" id="uColor">
                <br><br>

                <label>opinion : </label>
                <textarea rows="3px" cols="30px" id="uTxtarea"></textarea>
                <br><br>

                <a href="https://www.iqair.com/bangladesh/" target="_blank"><label>Terms & Condition</label></a>
                <input type="checkbox" id="termsCheck">
                <span id="termsMsg" class="error"></span>
                <br><br>

                <input type="reset" id="uReset">
                <input type="submit" id="uSubmit">
            </form>
        </div>
        <div class="right">
            <div class="top"></div>
            <div class="bottom"></div>
        </div>
    </div>

    <script>
        
        document.addEventListener('DOMContentLoaded', function() {
            const countries = ['USA', 'UK', 'Canada', 'Australia', 'Bangladesh', 'India'];
            const countrySelect = document.getElementById('uCountry');
            
            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                countrySelect.appendChild(option);
            });
        });

        function validateForm() {
            let isValid = true;
    
            
            let username = document.getElementById("uName").value.trim();
            let userMsg = document.getElementById("userMsg");
            if (username === "" || username.length < 6) {
                userMsg.innerHTML = "Username must be at least 6 characters.";
                isValid = false;
            } else if (!/^[a-zA-Z0-9]+$/.test(username)) {
                userMsg.innerHTML = "Username must be alphanumeric.";
                isValid = false;
            } else {
                userMsg.innerHTML = "";
            }
    
            
            let email = document.getElementById("uEmail").value.trim();
            let emailMsg = document.getElementById("emailMsg");
            if (email === "" || email.length < 8) {
                emailMsg.innerHTML = "Email must be at least 8 characters.";
                isValid = false;
            } else if (!/^\S+@\S+\.\S+$/.test(email)) {
                emailMsg.innerHTML = "Invalid email format.";
                isValid = false;
            } else {
                emailMsg.innerHTML = "";
            }
    
            
            let password = document.getElementById("uPass").value;
            let passMsg = document.getElementById("passMsg");
            if (password.length < 8) {
                passMsg.innerHTML = "Password must be at least 8 characters.";
                isValid = false;
            } else {
                passMsg.innerHTML = "";
            }
            
            
            let dob = document.getElementById("uDOB").value;
            let dobMsg = document.getElementById("dobMsg");
            if (!dob) {
                dobMsg.innerHTML = "Please select your date of birth.";
                isValid = false;
            } else {
                dobMsg.innerHTML = "";
            }
            
           
            let country = document.getElementById("uCountry").value;
            let countryMsg = document.getElementById("countryMsg");
            if (!country) {
                countryMsg.innerHTML = "Please select a country.";
                isValid = false;
            } else {
                countryMsg.innerHTML = "";
            }
            
           
            let gender = document.querySelector('input[name="gender"]:checked');
            let genderMsg = document.getElementById("genderMsg");
            if (!gender) {
                genderMsg.innerHTML = "Please select your gender.";
                isValid = false;
            } else {
                genderMsg.innerHTML = "";
            }
            
            
            let termsChecked = document.getElementById("termsCheck").checked;
            let termsMsg = document.getElementById("termsMsg");
            if (!termsChecked) {
                termsMsg.innerHTML = "You must accept the terms and conditions.";
                isValid = false;
            } else {
                termsMsg.innerHTML = "";
            }
    
            if (isValid) {
                let color = document.getElementById("uColor").value;
                document.body.style.backgroundColor = color;
                
                
                alert("Form submitted successfully!");
                return true;
            } else {
                return false; 
            }
        }
    </script>
</body>
</html>
