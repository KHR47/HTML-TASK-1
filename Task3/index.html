<!DOCTYPE html>
<html lang="en">
<head>
    <title>TABLE TO SHOW TOP 10 PLAYERS</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-color: #e3e3e3;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #222;
            font-size: 28px;
        }
        table {
            border: 1px solid #444;
            border-collapse: collapse;
            width: 550px;
            text-align: center;
            margin: auto;
            font-size: 16px;
        }
        th, td {
            border: 1px solid #444;
            width: 110px;
            height: 85px;
            padding: 8px;
        }
        th {
            height: 45px;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(odd) {
            background-color: #d4edda;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #D32F2F;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Top Ten Players</h1>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player Name</th>
                    <th>Picture</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>1</td><td>Sabbir Rahman</td><td><img src="assets/player1.jpg" alt="Player 1"></td></tr>
                <tr><td>2</td><td>Mahmudullah Riad</td><td><img src="assets/player2.jpg" alt="Player 2"></td></tr>
                <tr><td>3</td><td>Mehedi Hasan Miraz</td><td><img src="assets/player3.jpg" alt="Player 3"></td></tr>
                <tr><td>4</td><td>Tamim Iqbal</td><td><img src="assets/player4.jpg" alt="Player 4"></td></tr>
                <tr><td>5</td><td>Shakib Al Hasan</td><td><img src="assets/player5.jpg" alt="Player 5"></td></tr>
                <tr><td>6</td><td>Tawhid Hridoy</td><td><img src="assets/player6.jpg" alt="Player 6"></td></tr>
                <tr><td>7</td><td>Musfiqur Rahim</td><td><img src="assets/player7.jpg" alt="Player 7"></td></tr>
                <tr><td>8</td><td>Taskin Ahmed</td><td><img src="assets/player8.jpg" alt="Player 8"></td></tr>
                <tr><td>9</td><td>Liton Das</td><td><img src="assets/player9.jpg" alt="Player 9"></td></tr>
                <tr><td>10</td><td>Ebadot Hossain</td><td><img src="assets/player10.jpg" alt="Player 10"></td></tr>
            </tbody>
        </table>
    </div>
</body>
</html>
